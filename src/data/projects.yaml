# The hub's team projects, except the plugins, which come from the Anvil catalog's
# plugins.json (docs/spec.md, section 4). Each `id` has an icon in src/assets/projects/.
# Primary destination: own site, else Steam Workshop item, else repository.

- id: anvil
  name: Anvil
  group: anvil-ecosystem
  order: 1
  featured: true
  summary: Loads native plugins into Europa Universalis IV without changing `eu4.exe`, so Steam updates and file checks keep working.
  status: released
  primary:
    href: https://anvil.happydwarf.dev/
    label: Go to anvil.happydwarf.dev
  repo: https://github.com/happy-dwarf-team/anvil

- id: anvil-plugin-template
